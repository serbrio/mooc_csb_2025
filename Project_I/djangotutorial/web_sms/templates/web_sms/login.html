<h2>Login</h2>
<title>Login</title>
<form method="POST">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Login</button>
</form>

<h2>Register</h2>
<form id='register' action='/register/' method="GET">
  {% csrf_token %}
  <input type="submit" value="Register"/>
</form>
